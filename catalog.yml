# Curated set of federal laws tracked by leyes-mx.
#
# key:   the reform page of the law on LeyesBiblio (ref/<key>.htm). It is the
#        stable identifier used to find the law in index.htm.
# slug:  file name under leyes/ (leyes/<slug>.md).
# group: section of the README table.
# Optional:
#   ref_url:        reform history page when it is not ref/<key>.htm.
#   former_names:   earlier names, used to find legacy files in the archive.
#   history: false  skip archived versions (e.g. a different, abrogated law
#                   used the same name and file).

groups:
  constitucion: "Constitución"
  energia: "Energía (reforma de 2025)"
  recursos: "Minería, agua, tierra y ambiente"
  empresa: "Empresa, comercio y competencia"
  intangibles: "Propiedad intelectual y datos personales"
  general: "Trabajo, civil, amparo y procedimiento"
  publico: "Administración pública, fiscal y penal"

laws:
  - {key: cpeum, slug: cpeum, group: constitucion, ref_url: "https://www.diputados.gob.mx/LeyesBiblio/ref/cpeum_crono.htm"}

