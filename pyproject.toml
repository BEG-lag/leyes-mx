[project]
name = "leyes-mx"
version = "0.1.0"
description = "Mexican federal law as code: every law a Markdown file, every reform a commit."
readme = "README.md"
authors = [
    { name = "Benjamín Esponda García", email = "272673676+BEG-lag@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "olefile>=0.47",
    "pyyaml>=6.0.3",
]

[project.scripts]
leyes = "leyes_mx.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
