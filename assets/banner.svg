<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">leyes-mx</title>
  <desc id="d">Mexican federal law as code. Every reform, a commit. A terminal shows the git history of the Constitution and the diff of the 2026 reform that set a forty-hour work week.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eceee6" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#cfff45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#cfff45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#11141b" stop-opacity="0"/>
      <stop offset="1" stop-color="#11141b" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="card"><rect x="676" y="52" width="548" height="336" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: "Cormorant Garamond", "Cormorant", Garamond, Georgia, "Times New Roman", serif; font-style: italic; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .scan { animation: scan 5.5s ease-in-out infinite; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { 0%, 100% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 70% { opacity: .9; } 85% { transform: translateY(96px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .scan, .pulse { animation: none; } .scan { opacity: 0; } }
  </style>

  <rect width="1280" height="440" fill="#0a0c10"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow)" class="pulse"/>

  <!-- Left: identity -->
  <rect x="64" y="80" width="9" height="9" fill="#cfff45"/>
  <text x="84" y="89" class="mono" font-size="13" letter-spacing="3" fill="#969dab">DERECHO FEDERAL MEXICANO · COMO CÓDIGO</text>
  <text x="60" y="196" class="mono" font-size="100" font-weight="700" letter-spacing="-4" fill="#eceee6">leyes<tspan fill="#cfff45">-</tspan>mx</text>
  <text x="64" y="250" class="serif" font-size="38" fill="#eceee6">La ley mexicana, versionada.</text>
  <text x="64" y="290" class="sans" font-size="18" fill="#969dab">Every federal law in Markdown. Every reform, a commit.</text>

  <g class="mono" font-size="13">
    <rect x="64" y="328" width="98" height="30" rx="15" fill="none" stroke="#cfff45" stroke-opacity=".55"/>
    <text x="113" y="348" text-anchor="middle" fill="#cfff45">36 leyes</text>
    <rect x="172" y="328" width="168" height="30" rx="15" fill="none" stroke="#eceee6" stroke-opacity=".22"/>
    <text x="256" y="348" text-anchor="middle" fill="#eceee6">13,370 artículos</text>
    <rect x="350" y="328" width="214" height="30" rx="15" fill="none" stroke="#7fd8ff" stroke-opacity=".45"/>
    <text x="457" y="348" text-anchor="middle" fill="#7fd8ff">375 versiones en git</text>
  </g>

  <!-- Right: terminal -->
  <rect x="676" y="52" width="548" height="336" rx="14" fill="#11141b" stroke="#eceee6" stroke-opacity=".1"/>
  <g clip-path="url(#card)">
    <rect x="676" y="52" width="548" height="34" fill="#191d27"/>
    <circle cx="700" cy="69" r="5" fill="#ff5d47"/>
    <circle cx="718" cy="69" r="5" fill="#ffb648"/>
    <circle cx="736" cy="69" r="5" fill="#cfff45"/>
    <text x="950" y="73" text-anchor="middle" class="mono" font-size="12" fill="#969dab">leyes-mx · zsh</text>

    <g class="mono" font-size="13.5">
      <text x="698" y="118"><tspan fill="#cfff45">$</tspan><tspan fill="#eceee6"> git log --oneline -- leyes/cpeum.md</tspan></text>
      <text x="698" y="143"><tspan fill="#ffb648">6cd26a9</tspan><tspan fill="#eceee6"> CPEUM: reforma DOF 07-10-2026</tspan></text>
      <text x="698" y="165"><tspan fill="#ffb648">3e9003b</tspan><tspan fill="#eceee6"> CPEUM: reformas DOF 10-04-2026 a 02-06-2026</tspan></text>
      <text x="698" y="187"><tspan fill="#ffb648">8f63595</tspan><tspan fill="#eceee6"> CPEUM: reforma DOF 03-03-2026</tspan></text>
      <text x="698" y="209"><tspan fill="#969dab">        … 41 more, back to 2006</tspan></text>
      <text x="698" y="247"><tspan fill="#cfff45">$</tspan><tspan fill="#eceee6"> git show 8f63595 -- leyes/cpeum.md</tspan></text>
      <rect x="686" y="258" width="528" height="26" rx="4" fill="#cfff45" fill-opacity=".07" class="scan"/>
      <text x="698" y="276"><tspan fill="#ff5d47">-</tspan><tspan x="716" fill="#ff5d47">IV. Por cada seis días de trabajo deberá</tspan></text>
      <text x="698" y="296"><tspan fill="#ff5d47">-</tspan><tspan x="749" fill="#ff5d47">disfrutar el operario de un día de descanso…</tspan></text>
      <text x="698" y="322"><tspan fill="#cfff45">+</tspan><tspan x="716" fill="#cfff45">IV. La jornada laboral será de cuarenta</tspan></text>
      <text x="698" y="342"><tspan fill="#cfff45">+</tspan><tspan x="749" fill="#cfff45">horas semanales en los términos que</tspan></text>
      <text x="698" y="362"><tspan fill="#cfff45">+</tspan><tspan x="749" fill="#cfff45">establezca la Ley.</tspan><tspan class="cursor" fill="#cfff45"> ▍</tspan></text>
    </g>
  </g>
</svg>
